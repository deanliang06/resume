[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-adjuster"
version = "0.1.0"
description = "Local, provenance-safe resume tailoring for Dean's DOCX template"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.25,<2",
  "openai>=1.75,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a real local LibreOffice installation"]

[tool.setuptools.packages.find]
include = ["resume_adjuster*"]
